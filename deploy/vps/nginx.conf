# Blok Nginx untuk UangLapangan (lihat docs/DEPLOY-VPS.md). Ganti kas.domainanda.com dengan
# subdomain Anda, simpan sebagai /etc/nginx/sites-available/uanglapangan, lalu jalankan
# certbot --nginx -d <subdomain> — certbot menambahkan bagian HTTPS (port 443) sendiri.
# Blok ini hanya menjawab untuk subdomain tersebut; situs lain di server tidak terpengaruh.
server {
    listen 80;
    listen [::]:80;
    server_name kas.domainanda.com;

    # Subdomain lewat proxy Cloudflare (awan oranye)? Hapus tanda # di baris berikut supaya
    # alamat pengunjung yang asli terbaca.
    # include /opt/uanglapangan/deploy/vps/cloudflare-realip.conf;

    # Foto struk ikut terkirim bersama form (batas aplikasi 5 MB).
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Alamat pengunjung yang sebenarnya (dipakai pembatas percobaan masuk) — sengaja bukan
        # $proxy_add_x_forwarded_for, supaya tidak bisa dipalsukan dari luar.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Unduh laporan Excel berfoto & backup bisa memakan waktu.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
