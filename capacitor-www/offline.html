<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5c45" />
    <title>UangLapangan — tidak ada koneksi</title>
    <style>
      :root { color-scheme: light dark; --primary: #0f5c45; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f6f6; color: #1a1a1a; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
      .box { max-width: 360px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
      .icon { width: 64px; height: 64px; border-radius: 50%; background: #fdecc8; display: grid; place-items: center; font-size: 30px; }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; color: #666; line-height: 1.5; font-size: 15px; }
      button {
        width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--primary);
        color: #fff; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="icon" aria-hidden="true">📶</div>
      <h1>Tidak ada koneksi</h1>
      <p>
        UangLapangan perlu sinyal untuk dibuka pertama kali. Begitu terbuka, catatan tetap bisa
        dibuat saat offline dan dikirim otomatis saat sinyal kembali.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
